-
    name: '[QuickImportV2]'
    text: "<blockquote>\n${{\n  return await Zotero.BetterNotes.api.convert.link2html(link, {noteItem, dryRun: _env.dryRun});\n}}$\n</blockquote>"
-
    name: '[QuickNoteV5]'
    text: "// @use-refresh\n${{\n  let res = \"\";\n  if (annotationItem.annotationComment) {\n    res += await Zotero.BetterNotes.api.convert.md2html(\n      annotationItem.annotationComment\n    );\n  }\n  res += await Zotero.BetterNotes.api.convert.annotations2html([annotationItem], {noteItem, ignoreComment: true});\n  return res;\n}}$"
-
    name: '[ExportMDFileNameV2]'
    text: '@${(noteItem.parentItem && noteItem.parentItem.getField("citationKey")) || noteItem.key}.md'
-
    name: '[ExportMDFileHeaderV2]'
    text: "${{\n  let header = {};_env.dryRun\n  header.citekey = noteItem.parentItem\n    ? noteItem.parentItem.getField(\"citekey\")\n    : \"\";\n  header.title = noteItem.parentItem\n    ? noteItem.parentItem.getField(\"title\")\n    : \"\";\n  header.opinion = noteItem.parentItem\n    ? noteItem.parentItem.getField(\"caseName\")\n    : \"\";\n  header.statute = noteItem.parentItem\n    ? noteItem.parentItem.getField(\"nameOfAct\")\n    : \"\";\n  header.type = noteItem.parentItem.itemType;\n  header.collections = (\n    await Zotero.Collections.getCollectionsContainingItems([\n      (noteItem.parentItem || noteItem).id,\n    ])\n  ).map((c) => c.name);\n  header.tags = noteItem.getTags().map((_t) => _t.tag);\n  return JSON.stringify(header);\n}}$"
-
    name: '[ExportMDFileContent]'
    text: "${{\n  return mdContent;\n}}$"
-
    name: '[ExportLatexFileContent]'
    text: "${{\n  return latexContent;\n}}$"
-
    name: '[item]Main-Item'
    text: "\n// @use-refresh\n// @beforeloop-begin\n${{\n\tsharedObj.colors = {\n\t\t\"#ffd400\": { name: \"General\", annotations: [] },  // Yellow\n\t\t\"#f19837\": { name: \"Issue\", annotations: [] }, // Orange\n      \"#2ea8e5\": { name: \"Claim/Argument\", annotations: [] }, // Blue\n\t\t\"#5fb236\": { name: \"Analysis\", annotations: [] }, // Green\n\t\t\"#ff6666\": { name: \"Problem/Critique\", annotations: [] }, // Red\n      \"#e56eee\": { name: \"Conclusion\", annotations: [] }, // Magenta\n      \"#a28ae5\": { name: \"Other\", annotations: [] }, // Purple\n      \"#aaaaaa\": { name: \"Meta\", annotations: [] } // Grey  \n\t};\n\treturn \"\";\n}}$\n// @beforeloop-end\n// @default-begin\n// @use-markdown\n# @${topItem.getField('citationKey')}\n\n// @default-end\n\n// @afterloop-begin\n${await Zotero.BetterNotes.api.template.runItemTemplate(\"[item]SourceNotes\", {\n\titemIds: items.map(item=>item.id),\n\ttargetNoteId: targetNoteItem?.id,\n\tdryRun: _env.dryRun\n})}\n// @afterloop-end"
-
    name: '[item]Annotations by color'
    text: "// @author efink\n// @use-refresh\n// @beforeloop-begin\n  ${{\n  \tsharedObj.colors = {\n  \t\t\"#ffd400\": { name: \"General\", annotations: [] },  // Yellow\n  \t\t\"#f19837\": { name: \"Issue\", annotations: [] }, // Orange\n        \"#2ea8e5\": { name: \"Claim/Argument\", annotations: [] }, // Blue\n  \t\t\"#5fb236\": { name: \"Analysis\", annotations: [] }, // Green\n  \t\t\"#ff6666\": { name: \"Problem/Critique\", annotations: [] }, // Red\n        \"#e56eee\": { name: \"Conclusion\", annotations: [] }, // Magenta\n        \"#a28ae5\": { name: \"Other\", annotations: [] }, // Purple\n        \"#aaaaaa\": { name: \"Meta\", annotations: [] } // Grey        \n  \t};\n  \treturn \"\";\n  }}$\n// @beforeloop-end\n  \n// @default-begin\n// @use-markdown\n# @${topItem.getField('citationKey')}\n  \n  ${{\n  \tasync function getAnnotationsByColor(_attachment, color) {\n  \t\tconst annots = _attachment\n  \t\t.getAnnotations()\n  \t\t.filter((item) => item.annotationColor === color);\n  \t\tif (annots.length === 0) {\n  \t\t\treturn \"\";\n  \t\t}\n  \t\treturn Zotero.BetterNotes.api.convert.annotations2html(annots, {\n  \t\t\tnoteItem: targetNoteItem,\n  \t\t});\n  \t}\n  \n  \tconst getIdentifier = () => {\n  \t\tconst citationKey = topItem.getField(\"citationKey\");\n  \t\tif (citationKey) {\n  \t\t\treturn citationKey;\n  \t\t}\n  \t\tconst creators = topItem.getCreators();\n  \t\tif (creators.length === 0) {\n  \t\t\treturn \"No author\";\n  \t\t}\n  \t\tconst year = topItem.getField(\"year\");\n  \t\treturn `${creators[0].lastName}, ${year}`;\n  \t};\n  \n  \tconst itemHeader = ``;\n  \n  \tconst attachments = Zotero.Items.get(topItem.getAttachments())\n  \t\t.filter((i) => i.isPDFAttachment() || i.isSnapshotAttachment() || i.isEPUBAttachment()\n      );\n  \n  \tawait Promise.all(Object.keys(sharedObj.colors).map(async (color) => {\n  \t\tconst annotationsPromises = attachments.map((attachment) => getAnnotationsByColor(attachment, color));\n  \t\tconst renderedAnnotationsArray = await Promise.all(annotationsPromises);\n  \t\tconst renderedAnnotations = renderedAnnotationsArray.filter(Boolean).join(\"\");\n  \t\tif (renderedAnnotations) {\n  \t\t\tsharedObj.colors[color].annotations.push(itemHeader, renderedAnnotations);\n  \t\t}\n  \t}));\n  \n  \treturn \"\";\n  }}$\n// @default-end\n  \n// @afterloop-begin\n  ${{\n  \tlet output = `<h2>Annotations by color</h2>`;\n  \tfor (const color in sharedObj.colors) {\n  \t\tconst colorData = sharedObj.colors[color];\n  \t\tif (colorData.annotations.length > 0) {\n  \t\t\toutput += `<h3><p style=\"background-color:${color}70;\">${colorData.name}</p></h3>\n  \t\t\t\t\t\t${colorData.annotations.join(\"\")}`;\n  \t\t}\n  \t}\n  \treturn output;\n  }}$\n// @afterloop-end\n"
-
    name: '[item]SourceNotes'
    text: "// @ author efink@elon.edu\n// @use-markdown\n\n${(() => {\n\tconst article = topItem.getField(\"publicationTitle\");\n\tconst bookSection = topItem.getField(\"bookTitle\");\n\tconst legalCase = topItem.getField(\"court\");\n\tif (article) {\n\t\treturn `${topItem.getField('title')}, ${topItem.getField('volume')} ${topItem.getField('publicationTitle')} ${topItem.getField('pages')} (${topItem.getField('year')})`;\n\t} else if (legalCase) {\n\t\treturn `${topItem.getField('caseName')}, ${topItem.getField('reporterVolume')} ${topItem.getField('reporter')} ${topItem.getField('firstPage')} (${topItem.getField('court')} ${topItem.getField('year')})`;\n\t} else if (bookSection) {\n\t\treturn `${topItem.getField('title')}, in _${topItem.getField('bookTitle')}_ (${topItem.getField('year')})`;\n\t} else {\n\t\treturn `${topItem.getField('title')} (${topItem.getField('year')})`;\n\t}\n\t})()}\n  \n${{\n  \tlet author=topItem.getCreators().slice(0, 10).map((v) => v.firstName + \" \" + v.lastName).join(\"; \") + (topItem.getCreators().length > 10 ? \"; et al.\" : \";\");\n\tlet names = String(author);\n\tif (names.endsWith(';')) {\n\tnames = names.slice(0, -1);\n\t}\n\tnames=names.split(/;\\s*/)\n\tlet wrappedNames = names.map(name => `${name.trim()}`);\n\treturn wrappedNames.join(', ');\n\t}}$\n\n## Notes\n\n_Add notes here._\n  \n## PDF Annotations\n  \n  ${{\n    try {\n  \n      async function getAnnotation(item) {\n        try {\n          if (!item || !item.isAnnotation()) return null;\n  \n          let json = await Zotero.Annotations.toJSON(item);\n          json.id = item.key;\n          delete json.key;\n  \n          json.text = json.text || \"\";\n          json.comment = json.comment || \"\";\n          json.color = json.color || \"\";\n  \n          return json;\n        } catch (e) {\n          Zotero.logError(e);\n          return null;\n        }\n      }\n  \n      const attachments = Zotero.Items.get(topItem.getAttachments() || [])\n        .filter(i => i && i.isPDFAttachment && i.isPDFAttachment());\n  \n      let allAnnotations = [];\n  \n      for (const att of attachments) {\n        try {\n          const annots = att.getAnnotations ? att.getAnnotations() : [];\n          const jsonAnnots = await Promise.all(annots.map(a => getAnnotation(a)));\n          allAnnotations.push(...jsonAnnots.filter(Boolean));\n        } catch (e) {\n          Zotero.logError(e);\n        }\n      }\n  \n      allAnnotations.sort((a, b) => {\n        if ((a.pageIndex ?? 0) !== (b.pageIndex ?? 0)) {\n          return (a.pageIndex ?? 0) - (b.pageIndex ?? 0);\n        }\n        return (a.sortIndex ?? 0) - (b.sortIndex ?? 0);\n      });\n  \n      let output = \"\";\n  \n      for (const annot of allAnnotations) {\n  \n        const color = (annot.color || \"\").toLowerCase();\n  \n        const page = annot.pageLabel\n          ? ` (p. ${annot.pageLabel})`\n          : (annot.pageIndex != null ? ` (p. ${annot.pageIndex + 1})` : \"\");\n  \n        // GREY → SECTION TITLE\n        if (color === \"#aaaaaa\") {\n          output += `<h2><p style=\"background-color:${color}70;\">${annot.text}${page}</p></h2>`;\n          if (annot.comment) {\n            output += `<p style=\"background-color:${color}70;\">{${annot.comment}}</p>`;\n          }\n        }\n\n          // YELLOW → QUOTE + COMMENT\n          else if (color === \"#ffd400\") {\n            output += `<h3><p style=\"background-color:${color}70;\">General</p></h3> <blockquote><p style=\"background-color:${color}70;\">${annot.text}</p>${page}</blockquote>\n                ${annot.comment ? `<p>{${annot.comment}}</p>` : \"\"}`;\n          }\n          \n          // RED → QUOTE + COMMENT\n          else if (color === \"#ff6666\") {\n            output += `<h3><p style=\"background-color:${color}70;\">Problem/Critique</p></h3> <blockquote><p style=\"background-color:${color}70;\">${annot.text}</p>${page}</blockquote>\n                ${annot.comment ? `<p>{${annot.comment}}</p>` : \"\"}`;\n          }\n          \n          // GREEN → QUOTE + COMMENT\n          else if (color === \"#5fb236\") {\n            output += `<h3><p style=\"background-color:${color}70;\">Analysis</p></h3> <blockquote><p style=\"background-color:${color}70;\">${annot.text}</p>${page}</blockquote>\n                ${annot.comment ? `<p>{${annot.comment}}</p>` : \"\"}`;\n          }\n \n           // BLUE → QUOTE + COMMENT\n          else if (color === \"#2ea8e5\") {\n            output += `<h3><p style=\"background-color:${color}70;\">Claim/Argument</p></h3> <blockquote><p style=\"background-color:${color}70;\">${annot.text}</p>${page}</blockquote>\n                ${annot.comment ? `<p>{${annot.comment}}</p>` : \"\"}`;\n          }\n\n          // MAGENTA → QUOTE + COMMENT\n          else if (color === \"#e56eee\") {\n            output += `<h3><p style=\"background-color:${color}70;\">Conclusion</p></h3> <blockquote><p style=\"background-color:${color}70;\">${annot.text}</p>${page}</blockquote>\n                ${annot.comment ? `<p>{${annot.comment}}</p>` : \"\"}`;\n          }\n          \n  \n          // ORANGE → QUOTE + COMMENT\n          else if (color === \"#f19837\") {\n            output += `<h3><p style=\"background-color:${color}70;\">Issue</p></h3> <blockquote><p style=\"background-color:${color}70;\">${annot.text}</p>${page}</blockquote>\n                ${annot.comment ? `<p>{${annot.comment}}</p>` : \"\"}`;\n          }\n          \n          // PURPLE → QUOTE + COMMENT\n          else if (color === \"#a28ae5\") {\n            output += `<h3><p style=\"background-color:${color}70;\">Other</p></h3> <blockquote><p style=\"background-color:${color}70;\">${annot.text}</p>${page}</blockquote>\n                ${annot.comment ? `<p>{${annot.comment}}</p>` : \"\"}`;\n          }\n          \n      }\n  \n      return output || \"<p>No annotations found</p>\";\n  \n    } catch (e) {\n      Zotero.logError(e);\n      return \"<p>Error processing annotations</p>\";\n    }\n  }}$"
