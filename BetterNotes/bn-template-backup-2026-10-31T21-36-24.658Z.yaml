-
    name: '[item]AnnotationsByColor'
    text: "// @author efink\n// @use-markdown\n// @use-refresh\n\n${{\n    sharedObj.colors = {\n        \"#ffd400\": { name: \"Background/Facts\", annotations: [] },  // Yellow\n        \"#f19837\": { name: \"Issue\", annotations: [] }, // Orange\n        \"#2ea8e5\": { name: \"Claim/Argument\", annotations: [] }, // Blue\n        \"#5fb236\": { name: \"Analysis\", annotations: [] }, // Green\n        \"#ff6666\": { name: \"Theory/Rule\", annotations: [] }, // Red\n        \"#e56eee\": { name: \"Conclusion/Holding\", annotations: [] }, // Magenta\n        \"#a28ae5\": { name: \"Concern/Problem\", annotations: [] }, // Purple\n        \"#aaaaaa\": { name: \"Meta\", annotations: [] } // Grey  \n    };\n    return \"\";\n}}$\n\n ${(() => {\n    const article = topItem.getField(\"publicationTitle\");\n    const bookSection = topItem.getField(\"bookTitle\");\n    const legalCase = topItem.getField(\"court\");\n    if (article) {\n    \treturn `${topItem.getField('title')}, ${topItem.getField('volume')} ${topItem.getField('publicationTitle')} ${topItem.getField('pages')} (${topItem.getField('year')})`;\n    } else if (legalCase) {\n    \treturn `${topItem.getField('caseName')}, ${topItem.getField('reporterVolume')} ${topItem.getField('reporter')} ${topItem.getField('firstPage')} (${topItem.getField('court')} ${topItem.getField('year')})`;\n    } else if (bookSection) {\n    \treturn `${topItem.getField('title')}, in _${topItem.getField('bookTitle')}_ (${topItem.getField('year')})`;\n    } else {\n    \treturn `${topItem.getField('title')} (${topItem.getField('year')})`;\n    }\n  })()}\n    \n  ${{\n    let author=topItem.getCreators().slice(0, 10).map((v) => v.firstName + \" \" + v.lastName).join(\"; \") + (topItem.getCreators().length > 10 ? \"; et al.\" : \";\");\n    let names = String(author);\n    if (names.endsWith(';')) {\n    names = names.slice(0, -1);\n    }\n    names=names.split(/;\\s*/)\n    let wrappedNames = names.map(name => `${name.trim()}`);\n    return wrappedNames.join(', ');\n  }}$\n\n## Notes\n\n_Add notes here._\n  \n## PDF Annotations by Color\n\n  ${{\n  \tasync function getAnnotationsByColor(_attachment, color) {\n  \t\tconst annots = _attachment\n  \t\t.getAnnotations()\n  \t\t.filter((item) => item.annotationColor === color);\n  \t\tif (annots.length === 0) {\n  \t\t\treturn \"\";\n  \t\t}\n  \t\treturn Zotero.BetterNotes.api.convert.annotations2html(annots, {\n  \t\t\tnoteItem: targetNoteItem,\n  \t\t});\n  \t}\n  \n  \tconst getIdentifier = () => {\n  \t\tconst citationKey = topItem.getField(\"citationKey\");\n  \t\tif (citationKey) {\n  \t\t\treturn citationKey;\n  \t\t}\n  \t\tconst creators = topItem.getCreators();\n  \t\tif (creators.length === 0) {\n  \t\t\treturn \"No author\";\n  \t\t}\n  \t\tconst year = topItem.getField(\"year\");\n  \t\treturn `${creators[0].lastName}, ${year}`;\n  \t};\n  \n  \tconst itemHeader = ``;\n  \n  \tconst attachments = Zotero.Items.get(topItem.getAttachments())\n  \t\t.filter((i) => i.isPDFAttachment() || i.isSnapshotAttachment() || i.isEPUBAttachment()\n      );\n  \n  \tawait Promise.all(Object.keys(sharedObj.colors).map(async (color) => {\n  \t\tconst annotationsPromises = attachments.map((attachment) => getAnnotationsByColor(attachment, color));\n  \t\tconst renderedAnnotationsArray = await Promise.all(annotationsPromises);\n  \t\tconst renderedAnnotations = renderedAnnotationsArray.filter(Boolean).join(\"\");\n  \t\tif (renderedAnnotations) {\n  \t\t\tsharedObj.colors[color].annotations.push(itemHeader, renderedAnnotations);\n  \t\t}\n  \t}));\n  \n  \treturn \"\";\n  }}$\n\n  ${{\n  \tlet output = ``;\n  \tfor (const color in sharedObj.colors) {\n  \t\tconst colorData = sharedObj.colors[color];\n  \t\tif (colorData.annotations.length > 0) {\n  \t\t\toutput += `<h3><p style=\"background-color:${color}70;\">${colorData.name}</p></h3>\n  \t\t\t\t\t\t${colorData.annotations.join(\"\")}`;\n  \t\t}\n  \t}\n  \treturn output;\n  }}$"
-
    name: '[item]SourceNotes-Main'
    text: "// @beforeloop-begin\n// @beforeloop-end\n\n// @default-begin\n// @use-markdown\n# @${topItem.getField('citationKey')}\n// @default-end\n\n// @afterloop-begin\n${await Zotero.BetterNotes.api.template.runItemTemplate(\"[item]SourceNotes\", {\n\titemIds: items.map(item=>item.id),\n\ttargetNoteId: targetNoteItem?.id,\n\tdryRun: _env.dryRun\n})}\n// @afterloop-end"
-
    name: '[item]AnnotationsByColor-Main'
    text: "// @beforeloop-begin\n// @beforeloop-end\n\n// @default-begin\n// @use-markdown\n# @${topItem.getField('citationKey')}\n// @default-end\n\n// @afterloop-begin\n${await Zotero.BetterNotes.api.template.runItemTemplate(\"[item]AnnotationsByColor\", {\n\titemIds: items.map(item=>item.id),\n\ttargetNoteId: targetNoteItem?.id,\n\tdryRun: _env.dryRun\n})}\n// @afterloop-end"
-
    name: '[item]SourceNotes'
    text: "// @author emfink\n// @use-markdown\n// @use-refresh\n\n${{\n    sharedObj.colors = {\n        \"#ffd400\": { name: \"Background/Facts\", annotations: [] },  // Yellow\n        \"#f19837\": { name: \"Issue\", annotations: [] }, // Orange\n        \"#2ea8e5\": { name: \"Claim/Argument\", annotations: [] }, // Blue\n        \"#5fb236\": { name: \"Analysis\", annotations: [] }, // Green\n        \"#ff6666\": { name: \"Theory/Rule\", annotations: [] }, // Red\n        \"#e56eee\": { name: \"Conclusion/Holding\", annotations: [] }, // Magenta\n        \"#a28ae5\": { name: \"Concern/Problem\", annotations: [] }, // Purple\n        \"#aaaaaa\": { name: \"Meta\", annotations: [] } // Grey  \n    };\n    return \"\";\n}}$\n\n  ${(() => {\n    const article = topItem.getField(\"publicationTitle\");\n    const bookSection = topItem.getField(\"bookTitle\");\n    const legalCase = topItem.getField(\"court\");\n    if (article) {\n    \treturn `${topItem.getField('title')}, ${topItem.getField('volume')} ${topItem.getField('publicationTitle')} ${topItem.getField('pages')} (${topItem.getField('year')})`;\n    } else if (legalCase) {\n    \treturn `${topItem.getField('caseName')}, ${topItem.getField('reporterVolume')} ${topItem.getField('reporter')} ${topItem.getField('firstPage')} (${topItem.getField('court')} ${topItem.getField('year')})`;\n    } else if (bookSection) {\n    \treturn `${topItem.getField('title')}, in _${topItem.getField('bookTitle')}_ (${topItem.getField('year')})`;\n    } else {\n    \treturn `${topItem.getField('title')} (${topItem.getField('year')})`;\n    }\n  })()}\n    \n  ${{\n    let author=topItem.getCreators().slice(0, 10).map((v) => v.firstName + \" \" + v.lastName).join(\"; \") + (topItem.getCreators().length > 10 ? \"; et al.\" : \";\");\n    let names = String(author);\n    if (names.endsWith(';')) {\n    names = names.slice(0, -1);\n    }\n    names=names.split(/;\\s*/)\n    let wrappedNames = names.map(name => `${name.trim()}`);\n    return wrappedNames.join(', ');\n  }}$\n\n## Notes\n\n_Add notes here._\n  \n## PDF Annotations\n  \n  ${{\n    try {\n  \n      async function getAnnotation(item) {\n        try {\n          if (!item || !item.isAnnotation()) return null;\n  \n          let json = await Zotero.Annotations.toJSON(item);\n          json.id = item.key;\n          delete json.key;\n  \n          json.text = json.text || \"\";\n          json.comment = json.comment || \"\";\n          json.color = json.color || \"\";\n  \n          return json;\n        } catch (e) {\n          Zotero.logError(e);\n          return null;\n        }\n      }\n  \n      const attachments = Zotero.Items.get(topItem.getAttachments() || [])\n        .filter(i => i && i.isPDFAttachment && i.isPDFAttachment());\n  \n      let allAnnotations = [];\n  \n      for (const att of attachments) {\n        try {\n          const annots = att.getAnnotations ? att.getAnnotations() : [];\n          const jsonAnnots = await Promise.all(annots.map(a => getAnnotation(a)));\n          allAnnotations.push(...jsonAnnots.filter(Boolean));\n        } catch (e) {\n          Zotero.logError(e);\n        }\n      }\n  \n      allAnnotations.sort((a, b) => {\n        if ((a.pageIndex ?? 0) !== (b.pageIndex ?? 0)) {\n          return (a.pageIndex ?? 0) - (b.pageIndex ?? 0);\n        }\n        return (a.sortIndex ?? 0) - (b.sortIndex ?? 0);\n      });\n  \n      let output = \"\";\n  \n      for (const annot of allAnnotations) {\n  \n        const color = (annot.color || \"\").toLowerCase();\n\t\tconst colorData = sharedObj.colors[color];\n  \n        const page = annot.pageLabel\n          ? ` p. ${annot.pageLabel}`\n          : (annot.pageIndex != null ? ` (p. ${annot.pageIndex + 1})` : \"\");\n  \n        // GREY → SECTION TITLE\n        if (color === \"#aaaaaa\") {\n          output += `<h2><span style=\"background-color:${color}70;\">${annot.text}</span></h2>`;\n          if (annot.comment) {\n            output += `<span style=\"background-color:${color}70;\">{${annot.comment}}</span>`;\n          }\n        }\n\n          // YELLOW → QUOTE + COMMENT\n          else if (color === \"#ffd400\") {\n            output += `<h3><span style=\"background-color:${color}70;\">${colorData.name}</span></h3> <blockquote><span style=\"background-color:${color}70;\">${annot.text}</span></blockquote><p>(@${topItem.getField('citationKey')}, ${page})</p>\n                ${annot.comment ? `<p>{${annot.comment}}</p>` : \"\"}`;\n          }\n          \n          // RED → QUOTE + COMMENT\n          else if (color === \"#ff6666\") {\n            output += `<h3><span style=\"background-color:${color}70;\">${colorData.name}</span></h3> <blockquote><span style=\"background-color:${color}70;\">${annot.text}</span></blockquote><p>(@${topItem.getField('citationKey')}, ${page})</p>\n                ${annot.comment ? `<p>{${annot.comment}}</p>` : \"\"}`;\n          }\n          \n          // GREEN → QUOTE + COMMENT\n          else if (color === \"#5fb236\") {\n            output += `<h3><span style=\"background-color:${color}70;\">${colorData.name}</span></h3> <blockquote><span style=\"background-color:${color}70;\">${annot.text}</span></blockquote><p>(@${topItem.getField('citationKey')}, ${page})</p>\n                ${annot.comment ? `<p>{${annot.comment}}</p>` : \"\"}`;\n          }\n \n           // BLUE → QUOTE + COMMENT\n          else if (color === \"#2ea8e5\") {\n            output += `<h3><span style=\"background-color:${color}70;\">${colorData.name}</span></h3> <blockquote><span style=\"background-color:${color}70;\">${annot.text}</span></blockquote><p>(@${topItem.getField('citationKey')}, ${page})</p>\n                ${annot.comment ? `<p>{${annot.comment}}</p>` : \"\"}`;\n          }\n\n          // MAGENTA → QUOTE + COMMENT\n          else if (color === \"#e56eee\") {\n            output += `<h3><span style=\"background-color:${color}70;\">${colorData.name}</span></h3> <blockquote><span style=\"background-color:${color}70;\">${annot.text}</span></blockquote><p>(@${topItem.getField('citationKey')}, ${page})</p>\n                ${annot.comment ? `<p>{${annot.comment}}</p>` : \"\"}`;\n          }\n          \n  \n          // ORANGE → QUOTE + COMMENT\n          else if (color === \"#f19837\") {\n            output += `<h3><span style=\"background-color:${color}70;\">${colorData.name}</span></h3> <blockquote><span style=\"background-color:${color}70;\">${annot.text}</span></blockquote><p>(@${topItem.getField('citationKey')}, ${page})</p>\n                ${annot.comment ? `<p>{${annot.comment}}</p>` : \"\"}`;\n          }\n          \n          // PURPLE → QUOTE + COMMENT\n          else if (color === \"#a28ae5\") {\n            output += `<h3><span style=\"background-color:${color}70;\">${colorData.name}</span></h3> <blockquote><span style=\"background-color:${color}70;\">${annot.text}</span></blockquote><p>(@${topItem.getField('citationKey')}, ${page})</p>\n                ${annot.comment ? `<p>{${annot.comment}}</p>` : \"\"}`;\n          }\n      }\n  \n      return output || \"<p>No annotations found</p>\";\n  \n    } catch (e) {\n      Zotero.logError(e);\n      return \"<p>Error processing annotations</p>\";\n    }\n  }}$"
