                  try {
                      await updateItemType(itemsToEdit, selectedType.localized);
                  } catch (error) {
                      Zotero.logError(`Error in bulk edit script: ${error.message}`);
                  }
              }

              window.bulkEditRunning = false;
          } catch (error) {
              window.bulkEditRunning = false;
              Zotero.logError(`Error in bulk edit script: ${error.message}`);
          }
      })();
