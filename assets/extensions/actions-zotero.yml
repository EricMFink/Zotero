    data: >-
      (async function() {
          let similarityThreshold = 0.6;

          while (true) {
              const startTime = performance.now();

              try {
                  const items = await getItemsToEdit();
                  if (!items) {
                      console.log("No items to process.");
                      return;
                  }

                  const weights = {
                      lastName: 0.5,
                      firstName: 0.3,
                      fullName: 0.2
                  };

                  const weightsConfirmedTime = performance.now();
                  logTime("Time to confirm weights", weightsConfirmedTime - startTime);

                  console.log(`Using similarity threshold: ${similarityThreshold}`);
                  console.log(`Number of items to process: ${items.length}`);

                  const potentialDuplicates = await detectPotentialDuplicatesOptimized(items, similarityThreshold, weights);

                  const duplicatesDetectedTime = performance.now();
                  logTime("Time to detect duplicates", duplicatesDetectedTime - weightsConfirmedTime);

                  const action = await handleDetectedDuplicates(potentialDuplicates);

                  if (action === '4') {
                      similarityThreshold = getUserInputThreshold(weights);
                      if (similarityThreshold === null) return;
                  } else {
                      alert("Name similarity detection process completed.");
                      break;
                  }
              } catch (error) {
                  console.error(`Error in name similarity detection: ${error.message}`);
                  alert(`An error occurred: ${error.message}`);
                  break;
              } finally {
                  const endTime = performance.now();
                  logTime("Total time", endTime - startTime);
              }
          }
      })();


      function logTime(label, time) {
          try {
              console.log(`${label}: ${(time / 1000).toFixed(2)} seconds`);
          } catch (error) {
              console.error(`Failed to log time for ${label}: ${error.message}`);
          }
      }


      function normalizeWeights(weights) {
          const totalWeight = Object.values(weights).reduce((a, b) => a + b, 0);
          for (let key in weights) {
              weights[key] /= totalWeight;
          }
      }


      function getUserInputThreshold(weights) {
          const weightsInfo = `Weights used in the similarity calculation:\nLast Name: ${weights.lastName.toFixed(2)}\nFirst Name: ${weights.firstName.toFixed(2)}\nFull Name: ${weights.fullName.toFixed(2)}\n\n`;
          const thresholdInput = prompt(weightsInfo + "Enter the similarity threshold for detecting similar names (a number between 0 and 1, e.g., 0.6 for 60% similarity):", "0.6");

          const sanitizedThresholdInput = thresholdInput ? thresholdInput.trim() : null;
          const threshold = parseFloat(sanitizedThresholdInput);

          if (isNaN(threshold) || threshold < 0 || threshold > 1) {
              alert("Invalid threshold value. Please enter a number between 0 and 1.");
              return null;
          }

          console.log(`User input similarity threshold: ${threshold}`);
          return threshold;
      }


      async function detectPotentialDuplicatesOptimized(items, threshold,
      weights) {
          const potentialDuplicates = [];
          const creatorsList = [];

          for (const item of items) {
              const creators = item.getCreators();
              creators.forEach(creator => {
                  const normalizedCreator = normalizeCreator(creator);
                  creatorsList.push({ item, creator: normalizedCreator });
              });
          }

          for (let i = 0; i < creatorsList.length; i++) {
              const { item: item1, creator: creator1 } = creatorsList[i];
              for (let j = i + 1; j < creatorsList.length; j++) {
                  const { item: item2, creator: creator2 } = creatorsList[j];
                  const similarity = calculateCombinedSimilarity(creator1, creator2, weights);
                  if (similarity > threshold) {
                      potentialDuplicates.push({ item1, creator1, item2, creator2, similarity });
                      console.log(`Potential similar names found:\nItem 1: ${creator1.fullName}\nItem 2: ${creator2.fullName}\nSimilarity: ${similarity}`);
                  }
              }
          }

          return potentialDuplicates;
      }


      function normalizeCreator(creator) {
          const firstName = (creator.firstName || "").trim().normalize().toLowerCase();
          const lastName = (creator.lastName || creator.name || "").trim().normalize().toLowerCase();
          const fullName = `${firstName} ${lastName}`.trim();
          return { firstName, lastName, fullName };
      }


      function calculateCombinedSimilarity(creator1, creator2, weights) {
          const lastNameSimilarity = levenshteinSimilarity(creator1.lastName, creator2.lastName);
          const firstNameSimilarity = levenshteinSimilarity(creator1.firstName, creator2.firstName);
          const fullNameSimilarity = levenshteinSimilarity(creator1.fullName, creator2.fullName);
          return (lastNameSimilarity * weights.lastName) + (firstNameSimilarity * weights.firstName) + (fullNameSimilarity * weights.fullName);
      }


      // Function to calculate Levenshtein distance

      function levenshtein(a, b) {
          const matrix = [];

          for (let i = 0; i <= b.length; i++) {
              matrix[i] = [i];
          }

          for (let j = 0; j <= a.length; j++) {
              matrix[0][j] = j;
          }

          for (let i = 1; i <= b.length; i++) {
              for (let j = 1; j <= a.length; j++) {
                  if (b.charAt(i - 1) === a.charAt(j - 1)) {
                      matrix[i][j] = matrix[i - 1][j - 1];
                  } else {
                      matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1));
                  }
              }
          }

          return matrix[b.length][a.length];
      }


      // Function to calculate similarity based on Levenshtein distance

      function levenshteinSimilarity(a, b) {
          const distance = levenshtein(a, b);
          const maxLength = Math.max(a.length, b.length);
          return (maxLength - distance) / maxLength;
      }


      async function handleDetectedDuplicates(duplicates) {
          if (duplicates.length === 0) {
              console.log("No similar names found.");
              return;
          }

          const duplicatePairs = duplicates.map(({ item1, creator1, item2, creator2 }) => ({ item1, creator1, item2, creator2 }));
          let action;
          do {
              const similarNames = [...new Set(duplicatePairs.flatMap(pair => [pair.creator1.fullName, pair.creator2.fullName]))];
              const sampleNames = similarNames.slice(0, 3).join('\n');
              action = prompt(`Detected ${duplicates.length} similar name pairs. Here are some examples:\n${sampleNames}\nChoose an action for all:\n1. Replace names with a new name\n2. Ignore all\n3. Show all similar names\n4. Adjust similarity threshold\n\n(Press Cancel to skip)`);

              const sanitizedAction = action ? action.trim().toLowerCase() : null;

              if (sanitizedAction === '1') {
                  const newName = prompt(`Enter the new name to replace all similar names. The first part will be the first name, and the last part will be the last name:`, "");
                  if (newName) {
                      const nameParts = newName.trim().split(/\s+/);
                      const firstName = nameParts.slice(0, -1).join(' ');
                      const lastName = nameParts.slice(-1).join(' ');

                      for (const pair of duplicatePairs) {
                          await updateCreatorNames(pair.item1, pair.creator1, firstName, lastName);
                          await updateCreatorNames(pair.item2, pair.creator2, firstName, lastName);
                      }
                  }
              } else if (sanitizedAction === '2') {
                  console.log("Ignored all detected similar names.");
              } else if (sanitizedAction === '3') {
                  const allSimilarNames = similarNames.join('\n');
                  alert(`All similar names:\n${allSimilarNames}`);
              } else if (sanitizedAction === '4') {
                  return '4'; // Return to the main loop to adjust the similarity threshold
              } else {
                  console.log("Ignored all detected similar names.");
              }
          } while (action === '3');
          return action;
      }


      async function updateCreatorNames(item, creator, firstName, lastName) {
          try {
              const creators = item.getCreators();
              const updatedCreators = creators.map(c => {
                  if (normalizeCreator(c).fullName === creator.fullName) {
                      if (c.fieldMode === 1) {
                          c.firstName = "";
                          c.lastName = `${firstName} ${lastName}`.trim();
                      } else {
                          c.firstName = firstName;
                          c.lastName = lastName;
                      }
                      console.log("Updated creator:", c);
                  }
                  return c;
              });

              item.setCreators(updatedCreators);
              await item.saveTx();
          } catch (error) {
              console.error(`Failed to update creators for item ${item.id}: ${error.message}`);
          }
      }


      async function getItemsToEdit() {
          try {
              const zoteroPane = Zotero.getActiveZoteroPane();
              const editOption = prompt("Enter '1' to search selected items, '2' for items in the current collection, or '3' for items in a saved search:");

              const sanitizedEditOption = editOption ? editOption.trim() : null;

              let items = [];
              let searchOption = "";

              if (sanitizedEditOption === '2') {
                  const collection = zoteroPane.getSelectedCollection();
                  if (!collection) {
                      alert("No collection selected.");
                      return null;
                  }
                  items = await collection.getChildItems();
                  searchOption = "Current Collection";
              } else if (sanitizedEditOption === '3') {
                  const savedSearch = zoteroPane.getSelectedSavedSearch();
                  if (!savedSearch) {
                      alert("No saved search selected.");
                      return null;
                  }
                  const search = new Zotero.Search();
                  search.libraryID = savedSearch.libraryID;
                  search.addCondition('savedSearchID', 'is', savedSearch.id);
                  const itemIDs = await search.search();
                  if (itemIDs.length === 0) {
                      alert("No items found in the saved search.");
                      return null;
                  }
                  items = await Zotero.Items.getAsync(itemIDs);
                  searchOption = "Saved Search";
              } else {
                  const selectedItems = zoteroPane.getSelectedItems();
                  if (!selectedItems.length) {
                      alert("No items selected.");
                      return null;
                  }
                  items = selectedItems;
                  searchOption = "Selected Items";
              }

              console.log(`User selected search option: ${searchOption}`);
              return items;
          } catch (error) {
              console.error(`Error getting items to edit: ${error.message}`);
              alert(`An error occurred while retrieving items: ${error.message}`);
              return null;
          }
      }
    shortcut: ''
    enabled: true
    menu: Similar Name Detection
    name: Similar Name Detection
    showInMenu:
      item: true
      collection: true
      tools: true
      reader: false
      readerAnnotation: false
  1760017522127-QfZtKic9:
    event: 0
    operation: 4
    data: |-
      const Zotero = require("Zotero");
      const window = require("window");

      (async function () {
          const startTime = new Date();

          // Prevent concurrent duplicate detection processes
          if (window.duplicateDetectionRunning) {
              return;
          }
          window.duplicateDetectionRunning = true;
          Zotero.logError("Starting duplicate detection process.");

          try {
              // Obtain items to edit based on user selection or collection
              const items = await getItemsToEdit();
              if (!items || items.length === 0) {
                  Zotero.logError("No items to process.");
                  window.duplicateDetectionRunning = false;
                  return;
              }

              // Initialize and normalize weights for similarity calculation
              const weights = initializeWeights();
              normalizeWeights(weights);

              // Get user input for similarity threshold and validate it
              const threshold = getUserInputThreshold(weights);
              if (threshold === null) {
                  Zotero.logError("User cancelled the threshold input.");
                  window.duplicateDetectionRunning = false;
                  return;
              }

              // Detect duplicates based on the specified threshold and weights
              const potentialDuplicates = await detectPotentialDuplicates(items, threshold, weights);

              // Handle any detected duplicates with user interaction
              await handleDetectedDuplicates(potentialDuplicates);

          } catch (error) {
              Zotero.logError("Error in duplicate detection: " + error.message);
          } finally {
              window.duplicateDetectionRunning = false;
              const endTime = new Date();
              logTime("Total time", endTime - startTime);
              Zotero.logError("Duplicate detection process ended.");
          }
      })();

      function initializeWeights() {
          return {
              title: 0.4,
              shortTitle: 0.05,
              creators: 0.2,
              date: 0.05,
              publisher: 0.05,
              place: 0.05,
              journal: 0.05,
              DOI: 0.05,
              ISBN: 0.05,
              itemType: 0.05
          };
      }

      function normalizeWeights(weights) {
          const totalWeight = Object.values(weights).reduce((sum, value) => sum + value, 0);
          for (let key in weights) {
              weights[key] /= totalWeight;
          }
      }

      function getUserInputThreshold(weights) {
          const weightsInfo = Object.entries(weights)
              .map(([key, value]) => `${key}: ${value.toFixed(2)}`)
              .join("\n");
          const promptMessage = `Weights used in the similarity calculation:\n${weightsInfo}\nEnter the similarity threshold (0-1):`;
          const thresholdInput = window.prompt(promptMessage, "0.75");
          const threshold = parseFloat(thresholdInput);

          if (isNaN(threshold) || threshold < 0 || threshold > 1) {
              window.alert("Invalid threshold value. Please enter a number between 0 and 1.");
              return null;
          }
          return threshold;
      }

      async function detectPotentialDuplicates(items, threshold, weights) {
          const potentialDuplicates = [];
          const itemMap = new Map(items.map(item => [item.id, normalizeItemFields(item)]));

          const compareItems = async ([id1, item1], [id2, item2]) => {
              const similarity = calculateSimilarity(item1, item2, weights);
              Zotero.logError(`Comparing items ${id1} and ${id2} with similarity: ${similarity}`);
              if (similarity > threshold) {
                  return { item1: items.find(i => i.id === id1), item2: items.find(i => i.id === id2), similarity };
              }
              return null;
          };

          const comparisons = [];
          for (let [id1, item1] of itemMap) {
              for (let [id2, item2] of itemMap) {
                  if (id1 !== id2 && !pairAlreadyProcessed(id1, id2)) {
                      comparisons.push(compareItems([id1, item1], [id2, item2]));
                      markPairAsProcessed(id1, id2);
                  }
              }
          }

          const results = await Promise.all(comparisons);
          for (const result of results) {
              if (result !== null) {
                  potentialDuplicates.push(result);
              }
          }

          return potentialDuplicates;
      }

      function normalizeItemFields(item) {
          const fields = ['title', 'shortTitle', 'date', 'publisher', 'place', 'journal', 'DOI', 'ISBN', 'itemType'];
          const normalizedItem = {};
          fields.forEach(field => {
              normalizedItem[field] = normalizeField(item.getField(field));
          });
          normalizedItem.creators = normalizeCreators(item.getCreators());
          normalizedItem.itemType = item.itemType.toLowerCase().trim();
          Zotero.logError(`Normalized fields for item ${item.id}: ${JSON.stringify(normalizedItem)}`);
          return normalizedItem;
      }

      function normalizeField(field) {
          return (field || "").replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "").toLowerCase().trim();
      }

      function normalizeCreators(creators) {
          return creators.map(creator => `${creator.firstName || ""} ${creator.lastName || creator.name || ""}`.toLowerCase().trim()).join(' ');
      }

      function calculateSimilarity(item1, item2, weights) {
          const fields = ['title', 'shortTitle', 'date', 'publisher', 'place', 'journal', 'DOI', 'ISBN', 'itemType'];

          let totalWeight = 0;
          let combinedSimilarity = 0;

          fields.forEach(field => {
              const similarity = jaccardSimilarity(item1[field], item2[field]);
              combinedSimilarity += similarity * weights[field];
              totalWeight += weights[field];
              Zotero.logError(`Field: ${field}, Item1: ${item1[field]}, Item2: ${item2[field]}, Similarity: ${similarity}, Weighted Similarity: ${similarity * weights[field]}`);
          });

          const creatorSimilarity = jaccardSimilarity(item1.creators, item2.creators);
          combinedSimilarity += creatorSimilarity * weights.creators;
          totalWeight += weights.creators;
          Zotero.logError(`Creators Similarity: ${creatorSimilarity}, Weighted Creators Similarity: ${creatorSimilarity * weights.creators}`);

          return combinedSimilarity / totalWeight;
      }

      function jaccardSimilarity(str1, str2) {
          const set1 = new Set(str1.split(/\s+/));
          const set2 = new Set(str2.split(/\s+/));
          const intersection = new Set([...set1].filter(x => set2.has(x)));
          const union = new Set([...set1, ...set2]);
          return intersection.size / union.size;
      }

      const processedPairs = new Set();

      function pairAlreadyProcessed(id1, id2) {
          const pairKey = [id1, id2].sort().join("-");
          return processedPairs.has(pairKey);
      }

      function markPairAsProcessed(id1, id2) {
          const pairKey = [id1, id2].sort().join("-");
          processedPairs.add(pairKey);
      }

      async function handleDetectedDuplicates(duplicates) {
          if (duplicates.length === 0) {
              Zotero.logError("No duplicates found.");
              return;
          }

          const timestamp = Date.now();
          let stopProcessing = false;

          for (const { item1, item2, similarity } of duplicates) {
              if (stopProcessing) {
                  Zotero.logError("Processing stopped by the user.");
                  break;
              }

              const response = window.prompt(`Found duplicates with similarity ${similarity.toFixed(2)}:\n1: ${item1.getField('title')}\n2: ${item2.getField('title')}\nChoose action:\n1. Add a tag to both Items (e.g., duplicate-pair-${timestamp})\n2. Move Item 2 to Trash\n3. Ignore\n4. Stop Processing`);
              const sanitizedResponse = response ? response.trim() : null;

              switch (sanitizedResponse) {
                  case '1':
                      await addTagToItems(item1, item2, `duplicate-pair-${timestamp}`);
                      break;
                  case '2':
                      await moveItemToTrash(item2);
                      break;
                  case '3':
                      Zotero.logError(`Ignored items: ${item1.getField('title')} and ${item2.getField('title')}`);
                      break;
                  case '4':
                      stopProcessing = true;
                      break;
                  default:
                      Zotero.logError(`No valid action chosen for items: ${item1.getField('title')} and ${item2.getField('title')}`);
                      break;
              }
          }
      }

      async function addTagToItems(item1, item2, tag) {
          item1.addTag(tag);
          item2.addTag(tag);
          await item1.save();
          await item2.save();
          Zotero.logError(`Tagged items: ${item1.getField('title')} and ${item2.getField('title')} with ${tag}`);
      }

      async function moveItemToTrash(item) {
          await Zotero.Items.trashTx(item.id);
          Zotero.logError(`Moved item to trash: ${item.getField('title')}`);
      }

      function logTime(label, milliseconds) {
          Zotero.logError(`${label}: ${(milliseconds / 1000).toFixed(2)} seconds`);
      }

      async function getItemsToEdit() {
          const zoteroPane = Zotero.getActiveZoteroPane();
          let selectedItems = zoteroPane.getSelectedItems();
          if (!selectedItems.length) {
              let selectedCollection = zoteroPane.getSelectedCollection();
              if (selectedCollection) {
                  Zotero.logError(`Items from collection: ${selectedCollection.name}`);
                  selectedItems = await selectedCollection.getChildItems();
              } else {
                  window.alert("No items or collection selected.");
                  return null;
              }
          }
          return selectedItems;
      }
    shortcut: ''
    enabled: true
    menu: Duplicate Enhanced
    name: Duplicate Enhanced
    showInMenu:
      item: true
      collection: true
      tools: true
      reader: false
      readerAnnotation: false
