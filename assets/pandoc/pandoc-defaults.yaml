# PANDOC DEFAULTS FILE
# ====================
# Conversion: Markdown --> PDF (requires TeX suite to be installed)
# More info: https://pandoc.org/MANUAL.html

filters:
- include-files.lua
- citeproc
- pretty-urls.lua
pdf-engine: xelatex # Change this if you want to use a different engine, e.g. pdflatex
bibliography: ${HOME}/GitHub/Zotero/MyLibrary.json
csl:  ${HOME}/GitHub/Zotero/CSL-styles/indigobook-law-review.csl
citation-abbreviations: ${HOME}/GitHub/Zotero/CSL-styles/indigobook-abbrevs.json
template: /home/efink/.pandoc/templates/master.tex
